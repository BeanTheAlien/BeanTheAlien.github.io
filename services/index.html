<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Epic Website</title>
    <link rel="icon" type="image/png" href="/alien.png"/>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width"/>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <style>
      table {
        border-collapse: collapse; /* Merges double borders into a single line */
        text-align: center;
        margin: 1.5rem 0;
      }

      th, td {
        padding: 12px 15px; /* Adds breathing room inside cells */
        border-bottom: 1px solid #929292; /* Clean horizontal dividers */
      }

      thead th {
        background-color: #2c7ccd;
        font-weight: 600;
        border-bottom: 2px solid #999999; /* Slightly thicker line under header */
      }

      /* Zebra striping for easier scanning */
      tbody tr:nth-child(even) {
        background-color: #007a82;
      }

      /* Subtle highlight when hovering over a row */
      tbody tr:hover {
        background-color: #05a1ad;
      }
    </style>
    <script src="../pagedefault.js" type="module"></script>
    <h1 class="title" id="title">Service Availability</h1>
    <table style="margin: auto;">
        <thead>
            <tr>
                <th>Service</th>
                <th>Availability</th>
                <th>Response Time</th>
            </tr>
        </thead>
        <tbody>
            <tr id="serv-sv">
                <td>Server</td>
            </tr>
        </tbody>
    </table>
    <script src="index.js" type="module"></script>
  </body>
</html>
